name: Create and publish docker images

on:
  # Configures this workflow to run every time a new release is created.
  release:
    types: [created]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build flask app
        run: docker build -t ghcr.io/ljw20180420/flask_app:latest -f docker-images/flask_app.df .

      - name: Push base
        run: docker push ghcr.io/ljw20180420/flask_app:latest

      - name: Build base
        run: docker build -t ghcr.io/ljw20180420/rearr_base:latest -f docker-images/rearr_base.df .
      
      - name: Push base
        run: docker push ghcr.io/ljw20180420/rearr_base:latest

      - name: Build rearr
        run: docker build -t ghcr.io/ljw20180420/rearr:latest -f docker-images/rearr.df .

      - name: Run unit test in docker
        run: docker run --rm -v "./test:/app/test" ghcr.io/ljw20180420/rearr:latest python -m unittest test.test_suite_no_genome

      - name: Push rearr
        run: docker push ghcr.io/ljw20180420/rearr:latest
