services:
  rabbitmq:
    restart: always
    container_name: celery_rabbitmq
    image: rabbitmq:latest
  
  redis:
    restart: always
    container_name: celery_redis
    image: redis:latest

  beat:
    depends_on:
      - rabbitmq
      - redis
    restart: always
    container_name: celery_beat
    image: mher/flower:latest
    user: root
    volumes:
      - "./docker_mounts/flask_app:/data/flask_app"
    command: celery -A flask_app.tasks -b amqp://rabbitmq:5672 --result-backend redis://redis:6379/0 beat

  worker:
    depends_on:
      - rabbitmq
      - redis
    restart: always
    container_name: celery_worker
    image: ghcr.io/ljw20180420/rearr:latest
    build:
      context: ..
      dockerfile: docker-images/rearr.df
    volumes:
      - "./docker_mounts/flask_app:/flask_app"
    command: celery -A flask_app.tasks -b amqp://rabbitmq:5672 --result-backend redis://redis:6379/0 worker

  flask:
    depends_on:
      - rabbitmq
      - redis
      - worker
    restart: always
    container_name: flask_app
    image: ghcr.io/ljw20180420/flask_app:latest
    build:
      context: ..
      dockerfile: docker-images/flask_app.df
    volumes:
      - "./docker_mounts/flask_app:/flask_app"
    command: python -m flask_app -b amqp://rabbitmq:5672 --result-backend redis://redis:6379/0

  flower:
    depends_on:
      - rabbitmq
      - redis
      - worker
    restart: always
    container_name: celery_flower
    image: mher/flower:latest
    volumes:
      - "./docker_mounts/flask_app:/data/flask_app"
    command: celery -A flask_app.tasks -b amqp://rabbitmq:5672 --result-backend redis://redis:6379/0 flower --url_prefix=/flower

  nginx:
    depends_on:
      - flask
      - flower
      - shiny
    restart: always
    container_name: nginx_server
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - "./nginx:/etc/nginx/conf.d"
      - "./jekyll/_site:/usr/share/nginx/html"
    # command: [nginx-debug, '-g', 'daemon off;']

  shiny:
    restart: always
    container_name: shiny_server
    image: ghcr.io/rocker-org/shiny-verse:latest
    volumes:
      - "./docker_mounts/shiny_apps:/srv/shiny-server"
