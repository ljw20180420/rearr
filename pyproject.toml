[project]
name = "rearr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ljw", email = "ljw2017@sjtu.edu.cn" }
]
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.88",
    "celery[redis]>=5.6.3",
    "docopt>=0.6.2",
    "flask>=3.1.3",
    "kaleido>=1.5.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pysam>=0.24.1",
    "scipy>=1.18.1",
    "sh>=2.4.0",
    "waitress>=3.0.2",
]

[project.scripts]
rearr = "rearr:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
